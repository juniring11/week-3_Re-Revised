<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>곁에서, 곁으로 · 3주차 영화 초대 메시지</title>
<style>
  :root{
    --green:#74a942;
    --green-deep:#5f9235;
    --green-ink:#3f6425;
    --navy:#213a5c;
    --paper:#f6f4ec;
    --card:#ffffff;
    --ink:#2a2f27;
    --muted:#6d7466;
    --line:#e4e1d6;
    --shadow:0 2px 10px rgba(60,70,45,.07);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);color:var(--ink);
    font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
    line-height:1.6;padding:0 0 env(safe-area-inset-bottom);
  }
  .wrap{max-width:560px;margin:0 auto;padding:22px 18px 60px;}

  /* 배너 이미지 */
  .banner{margin:2px 0 4px;border-radius:16px;overflow:hidden;box-shadow:var(--shadow);
    border:1px solid var(--line);}
  .banner img{display:block;width:100%;height:auto;}

  /* 헤더 */
  header{padding:6px 2px 18px;}
  .kicker{display:inline-flex;align-items:center;gap:7px;font-size:13px;color:var(--green-deep);font-weight:600;margin-bottom:10px;}
  .kicker svg{width:20px;height:20px;}
  h1{font-size:23px;font-weight:800;letter-spacing:-.02em;margin:0 0 6px;line-height:1.25;}
  .sub{font-size:14px;color:var(--muted);margin:0;}

  /* 이름 입력 */
  .namebox{background:var(--card);border:1px solid var(--line);border-radius:14px;
    padding:14px 15px;margin:18px 0 8px;box-shadow:var(--shadow);}
  .namebox label{display:block;font-size:13px;font-weight:700;color:var(--ink);margin-bottom:8px;}
  .namebox .row{display:flex;gap:9px;align-items:center;}
  .namebox input{flex:1;border:1px solid var(--line);border-radius:10px;padding:11px 13px;
    font-size:16px;font-family:inherit;color:var(--ink);background:#fcfbf7;min-width:0;}
  .namebox input:focus{outline:none;border-color:var(--green);background:#fff;}
  .namebox .hint{font-size:12px;color:var(--muted);margin:9px 2px 0;line-height:1.5;}
  .clearbtn{flex:0 0 auto;border:none;background:#eef1ea;color:var(--green-deep);
    font-size:13px;font-weight:600;border-radius:10px;padding:11px 13px;font-family:inherit;}
  .clearbtn:active{background:#e2e8db;}

  /* 안내 라인 */
  .howto{font-size:13px;color:var(--muted);margin:20px 2px 12px;
    display:flex;align-items:flex-start;gap:8px;line-height:1.55;}
  .howto svg{width:16px;height:16px;flex:0 0 auto;color:var(--green);margin-top:2px;}
  .howto b{color:var(--ink);font-weight:700;}


  /* 영화 초대 섹션 */
  .movie-invite{background:var(--card);border:1px solid var(--line);border-radius:16px;
    box-shadow:var(--shadow);padding:18px 16px 16px;margin:6px 0 20px;}
  .mv-head{margin-bottom:12px;}
  .mv-badge{display:inline-block;font-size:12px;font-weight:700;color:#fff;background:var(--navy);
    border-radius:999px;padding:5px 13px;margin-bottom:9px;}
  .mv-title{font-size:19px;font-weight:800;margin:2px 0 5px;color:var(--ink);letter-spacing:-.01em;}
  .mv-sub{font-size:13.5px;color:var(--muted);margin:0;line-height:1.55;}
  .mv-ticket{display:block;width:100%;height:auto;border-radius:12px;margin:12px 0 10px;
    border:1px solid var(--line);}
  .mv-note{font-size:13.5px;font-weight:600;color:var(--green-ink);background:#eef4e6;
    border-radius:10px;padding:11px 13px;margin:0;text-align:center;line-height:1.5;}


  /* 영화 초대장 카드 */
  .invite-card{margin:6px 0 20px;border-radius:16px;overflow:hidden;box-shadow:var(--shadow);border:1px solid var(--line);}
  .invite-bg{position:relative;width:100%;aspect-ratio:870/500;background-size:cover;background-position:center;}
  .invite-overlay{position:absolute;top:0;left:0;height:100%;width:56%;
    padding:5% 5% 5% 6%;display:flex;flex-direction:column;justify-content:center;gap:6%;color:#fff;}
  .inv-to{font-size:clamp(15px,4.6vw,26px);font-weight:800;line-height:1.35;margin:0;
    text-shadow:0 1px 6px rgba(0,0,0,.35);letter-spacing:-.01em;}
  .inv-to #inv-name{color:#8fd0ff;}
  .inv-info{margin:0;}
  .inv-movie{font-size:clamp(13px,3.7vw,20px);font-weight:800;margin:0 0 2%;text-shadow:0 1px 5px rgba(0,0,0,.4);}
  .inv-when{font-size:clamp(11px,3vw,16px);font-weight:600;margin:0 0 1%;color:#e3edf7;text-shadow:0 1px 4px rgba(0,0,0,.4);}
  .inv-where{font-size:clamp(10px,2.7vw,15px);margin:0 0 3%;color:#cfe0f0;text-shadow:0 1px 4px rgba(0,0,0,.4);}
  .inv-sub{font-size:clamp(10px,2.7vw,14px);margin:0;color:#bcd2e8;text-shadow:0 1px 4px rgba(0,0,0,.4);line-height:1.4;}


  .invite-copybar{display:flex;align-items:center;justify-content:space-between;gap:10px;
    padding:13px 16px;background:#fbfaf5;border-top:1px solid var(--line);}
  .invite-copybar .inv-hint{font-size:13px;color:var(--muted);}
  .inv-copybtn{flex:0 0 auto;}

  /* 메시지 카드 */
  .card-msg{background:var(--card);border:1px solid var(--line);border-radius:16px;
    box-shadow:var(--shadow);margin-bottom:14px;overflow:hidden;
    transition:transform .12s ease, box-shadow .12s ease;}
  .card-msg:active{transform:scale(.988);}
  .card-inner{padding:16px 16px 0;}
  .num{display:inline-flex;align-items:center;justify-content:center;
    width:26px;height:26px;border-radius:50%;background:var(--green);color:#fff;
    font-size:13px;font-weight:700;margin-bottom:11px;}
  .text{font-size:15.5px;line-height:1.75;color:var(--ink);margin:0 0 15px;
    white-space:pre-wrap;word-break:keep-all;}
  .text .nm{color:var(--green-ink);font-weight:700;
    background:linear-gradient(transparent 62%, #dcebc9 62%);padding:0 1px;}
  .copybar{display:flex;align-items:center;justify-content:space-between;
    border-top:1px solid var(--line);padding:13px 16px;background:#fbfaf5;}
  .copybar .len{font-size:12px;color:var(--muted);}
  .copybtn{display:inline-flex;align-items:center;gap:7px;border:none;
    background:var(--green);color:#fff;font-size:14.5px;font-weight:700;font-family:inherit;
    border-radius:11px;padding:11px 20px;}
  .copybtn svg{width:17px;height:17px;}
  .copybtn:active{background:var(--green-deep);}
  .copybtn.done{background:var(--navy);}

  footer{text-align:center;font-size:12.5px;color:var(--muted);margin-top:26px;line-height:1.7;}
  footer .verse{color:var(--green-deep);font-weight:600;}

  /* 토스트 */
  #toast{position:fixed;left:50%;bottom:calc(28px + env(safe-area-inset-bottom));
    transform:translateX(-50%) translateY(20px);
    background:var(--navy);color:#fff;font-size:14px;font-weight:600;
    padding:13px 22px;border-radius:999px;box-shadow:0 6px 20px rgba(0,0,0,.22);
    opacity:0;pointer-events:none;transition:opacity .25s ease, transform .25s ease;z-index:50;
    display:flex;align-items:center;gap:8px;}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
  #toast svg{width:18px;height:18px;}

  @media (prefers-reduced-motion: reduce){
    .card-msg,#toast{transition:none;}
  }

  /* 초대장 이미지 공유 */
  .invite-copybar{flex-direction:column;align-items:stretch;gap:10px;}
  .invite-copybar .inv-hint{font-size:12.5px;color:var(--muted);line-height:1.55;margin:0;}
  .invite-copybar .inv-hint b{color:var(--green-ink);}
  .inv-btns{display:flex;gap:8px;}
  .inv-imgbtn{flex:1 1 auto;justify-content:center;}
  .inv-imgbtn.loading{opacity:.65;}
  .inv-copybtn.ghost{flex:0 0 auto;background:#fff;color:var(--green-ink);
    border:1px solid var(--line);}
  .inv-copybtn.ghost svg{stroke:var(--green-ink);}

</style>
</head>

    "{NAME}님, 지난번 마음 전한 뒤로 꼭 한번 얼굴 보고 싶었어요. 그래서 좋은 자리를 한번 만들어 봤어요.\n10월 4일, 오후 4시에 강화작은영화관에서 「인턴」을 함께 봐요.\n시간을 내주시면 참 좋겠어요.",
    "{NAME}님, 우리 이번에 얼굴 보고 함께하면 어떨까요?\n마침 좋은 영화가 있어요. 10월 4일, 일요일 오후 4시,\n강화작은영화관에서 「인턴」이에요. 제가 준비해 놓을께요.",
    "그동안 마음으로만 전했는데, 우리 만날까요?\n10월 4일, 오후 4시에 강화작은영화관에서 「인턴」 같이 봐요.\n영화도 보고, {NAME}님과 함께 즐거운 시간을 가지고요.",
    "{NAME}님, 마침 10월 4일, 일요일 오후 4시에 강화작은영화관에서 「인턴」 상영한대요. 좋은 핑계 삼아 같이 시간 보내요. 제가 준비해 놓을께요."
  ];

  var listEl = document.getElementById('list');
  var nmInput = document.getElementById('nm');
  var PLACE = '○○';

  function nameVal(){
    var v = (nmInput && nmInput.value) ? nmInput.value : '';
    v = v.replace(/^\s+|\s+$/g, '');
    return v || PLACE;
  }
  function replaceAllName(tpl, val){
    return tpl.split('{NAME}').join(val);
  }
  function filled(tpl){ return replaceAllName(tpl, nameVal()); }
  function escapeHtml(s){
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }
  function displayHTML(tpl){
    var nm = nameVal();
    var safe = escapeHtml(filled(tpl));
    var token = nm + '님';
    return safe.split(token).join('<span class="nm">' + token + '</span>');
  }

  var COPY_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="11" height="11" rx="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>';

  function build(){
    var html = '';
    for(var i=0;i<messages.length;i++){
      var len = filled(messages[i]).length;
      html += '<div class="card-msg">'
        + '<div class="card-inner">'
        + '<span class="num">' + (i+1) + '</span>'
        + '<p class="text" id="text-' + i + '">' + displayHTML(messages[i]) + '</p>'
        + '</div>'
        + '<div class="copybar">'
        + '<span class="len" id="len-' + i + '">' + len + '자</span>'
        + '<button class="copybtn" data-i="' + i + '" type="button">'
        + COPY_SVG + '<span class="lbl">복사하기</span>'
        + '</button>'
        + '</div>'
        + '</div>';
    }
    listEl.innerHTML = html;
  }

  function updateInviteName(){
    var el=document.getElementById('inv-name');
    if(el){ el.textContent = nameVal(); }
  }
  function refreshTexts(){
    updateInviteName();
    var ivb=document.querySelector('.inv-copybtn'); if(ivb){ ivb.className='copybtn inv-copybtn ghost'; var l=ivb.getElementsByClassName('lbl')[0]; if(l)l.textContent='복사하기'; }
  bindInviteCopy();
    for(var i=0;i<messages.length;i++){
      var t = document.getElementById('text-' + i);
      if(t){ t.innerHTML = displayHTML(messages[i]); }
      var lenEl = document.getElementById('len-' + i);
      if(lenEl){ lenEl.textContent = filled(messages[i]).length + '자'; }
    }
    var btns = listEl.getElementsByClassName('copybtn');
    for(var k=0;k<btns.length;k++){
      btns[k].className = 'copybtn';
      var lbl = btns[k].getElementsByClassName('lbl')[0];
      if(lbl){ lbl.textContent = '복사하기'; }
    }
  }

  // 복사 (구형/인앱 브라우저 폴백)
  function copyText(text){
    // execCommand 우선 (인앱 호환성 높음)
    var ok = false;
    try{
      var ta = document.createElement('textarea');
      ta.value = text;
      ta.setAttribute('readonly','');
      ta.style.position = 'fixed';
      ta.style.top = '0';
      ta.style.left = '0';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.focus();
      ta.select();
      try{ ta.setSelectionRange(0, text.length); }catch(e1){}
      try{ ok = document.execCommand('copy'); }catch(e2){ ok = false; }
      document.body.removeChild(ta);
    }catch(e3){ ok = false; }

    // 최신 API도 시도 (지원 시)
    if(!ok && navigator.clipboard && navigator.clipboard.writeText){
      try{ navigator.clipboard.writeText(text); ok = true; }catch(e4){}
    }
    return ok;
  }

  // 복사 실패 시: 해당 문구를 화면에서 선택 상태로 만들어 "길게 눌러 복사" 유도
  function selectText(el){
    try{
      var range = document.createRange();
      range.selectNodeContents(el);
      var sel = window.getSelection();
      sel.removeAllRanges();
      sel.addRange(range);
    }catch(e){}
  }

  var toastTimer = null;
  function toast(msg){
    var t = document.getElementById('toast');
    document.getElementById('toast-text').textContent = msg;
    t.className = 'show';
    if(toastTimer){ clearTimeout(toastTimer); }
    toastTimer = setTimeout(function(){ t.className = ''; }, 2400);
  }

  function onCopyClick(btn){
    var i = parseInt(btn.getAttribute('data-i'), 10);
    var text = filled(messages[i]);
    var ok = copyText(text);
    var nm = nmInput.value.replace(/^\s+|\s+$/g,'');
    if(ok){
      btn.className = 'copybtn done';
      var lbl = btn.getElementsByClassName('lbl')[0];
      if(lbl){ lbl.textContent = '복사됨'; }
      toast(nm ? (nm + '님께 보낼 문구를 복사했어요') : '복사됐어요 · 붙여넣기 하세요');
    }else{
      // 폴백: 문구 선택 + 안내
      var p = document.getElementById('text-' + i);
      if(p){ selectText(p); }
      toast('문구가 선택됐어요 · 길게 눌러 “복사”를 눌러 주세요');
    }
  }

  // 이벤트 위임 (구형 호환)
  listEl.onclick = function(e){
    e = e || window.event;
    var target = e.target || e.srcElement;
    while(target && target !== listEl){
      if(target.className && target.className.indexOf('copybtn') === 0){
        onCopyClick(target);
        return;
      }
      target = target.parentNode;
    }
  };

  if(nmInput){
    nmInput.oninput = refreshTexts;
    nmInput.onkeyup = refreshTexts; // 구형 대비
  }
  var clearBtn = document.getElementById('clear');
  if(clearBtn){
    clearBtn.onclick = function(){ nmInput.value = ''; refreshTexts(); nmInput.focus(); };
  }

  function inviteText(){
    var nm = nameVal();
    return nm + "님, 당신을 초대합니다.\n\n" +
      "영화 「인턴」\n" +
      "2026. 10. 4 (일) 오후 4시\n" +
      "강화 작은영화관\n\n" +
      "함께 웃고, 함께 이야기 나누는 시간이에요. 같이 가요!";
  }
  function bindInviteCopy(){
    var btn = document.querySelector('.inv-copybtn');
    if(!btn) return;
    btn.onclick = function(){
      var ok = copyText(inviteText());
      var nm = nmInput.value.replace(/^\s+|\s+$/g,'');
      if(ok){
        btn.className = 'copybtn inv-copybtn ghost done';
        var lbl = btn.getElementsByClassName('lbl')[0];
        if(lbl){ lbl.textContent = '복사됨'; }
        toast(nm ? (nm + '님 초대장을 복사했어요') : '초대장을 복사했어요 · 붙여넣기 하세요');
      }else{
        toast('복사가 안 되면 문구를 길게 눌러 복사하세요');
      }
    };
  }
  // ===== 초대장을 '이미지'로 만들어 카카오톡·문자로 보내기 =====
  function inviteFileBase(){
    var nm = nmInput.value.replace(/^\s+|\s+$/g,'');
    return (nm ? nm + '님_' : '') + '영화초대장';
  }
  function renderInviteCanvas(){
    var target = document.querySelector('.invite-bg');
    var scale = Math.min(3, Math.max(2, (window.devicePixelRatio || 1) * 1.5));
    return html2canvas(target, {
      backgroundColor: null,
      scale: scale,
      useCORS: true,
      logging: false
    });
  }
  function canvasToBlob(canvas){
    return new Promise(function(resolve, reject){
      try{
        if(canvas.toBlob){
          canvas.toBlob(function(b){ b ? resolve(b) : reject(new Error('blob null')); }, 'image/png');
        }else{
          var data = canvas.toDataURL('image/png');
          var bin = atob(data.split(',')[1]);
          var arr = new Uint8Array(bin.length);
          for(var i=0;i<bin.length;i++){ arr[i] = bin.charCodeAt(i); }
          resolve(new Blob([arr], {type:'image/png'}));
        }
      }catch(e){ reject(e); }
    });
  }
  function downloadBlob(blob, filename){
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); }, 4000);
  }
  var invSharing = false;
  function bindInviteShare(){
    var btn = document.getElementById('invImgBtn');
    if(!btn) return;
    btn.onclick = function(){
      if(invSharing) return;
      if(typeof html2canvas === 'undefined'){
        toast('이미지 기능을 불러오지 못했어요 · 새로고침 후 다시 시도해 주세요');
        return;
      }
      invSharing = true;
      var lbl = btn.getElementsByClassName('lbl')[0];
      var prev = lbl ? lbl.textContent : '이미지로 보내기';
      btn.className = 'copybtn inv-imgbtn loading';
      if(lbl){ lbl.textContent = '이미지 만드는 중…'; }

      renderInviteCanvas().then(function(canvas){
        return canvasToBlob(canvas);
      }).then(function(blob){
        var nm = nmInput.value.replace(/^\s+|\s+$/g,'');
        var fname = inviteFileBase() + '.png';
        var file = null;
        try{ file = new File([blob], fname, {type:'image/png'}); }catch(e){ file = null; }

        // 1) 휴대폰: 네이티브 공유 시트 → 카카오톡·메시지 선택 (가장 확실)
        if(file && navigator.canShare && navigator.canShare({files:[file]}) && navigator.share){
          return navigator.share({
            files: [file],
            title: '영화 「인턴」 초대장',
            text: inviteText()
          }).then(function(){
            toast('공유 창에서 카카오톡·메시지를 선택하세요');
          }).catch(function(err){
            if(err && err.name === 'AbortError'){ return; } // 사용자가 취소
            downloadBlob(blob, fname);
            toast('초대장 이미지를 저장했어요 · 사진에서 보내주세요');
          });
        }

        // 2) PC: 이미지 클립보드 복사 → 카톡PC/메시지에 붙여넣기
        if(window.ClipboardItem && navigator.clipboard && navigator.clipboard.write){
          try{
            var item = new ClipboardItem({'image/png': blob});
            return navigator.clipboard.write([item]).then(function(){
              toast(nm ? (nm + '님 초대장 이미지를 복사했어요 · 붙여넣기 하세요')
                       : '초대장 이미지를 복사했어요 · 붙여넣기 하세요');
            }).catch(function(){
              downloadBlob(blob, fname);
              toast('초대장 이미지를 저장했어요');
            });
          }catch(e2){
            downloadBlob(blob, fname);
            toast('초대장 이미지를 저장했어요');
            return;
          }
        }

        // 3) 그 외: 이미지 저장(다운로드)
        downloadBlob(blob, fname);
        toast('초대장 이미지를 저장했어요');
      }).catch(function(err){
        toast('이미지를 만들지 못했어요 · 화면을 캡처해 보내주세요');
      }).then(function(){
        invSharing = false;
        btn.className = 'copybtn inv-imgbtn';
        if(lbl){ lbl.textContent = prev || '이미지로 보내기'; }
      });
    };
  }

  build();
  updateInviteName();
  bindInviteCopy();
  bindInviteShare();

</script>
</body>
</html>
